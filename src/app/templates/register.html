{% extends "base.html" %}
{% block title %}Registro — ERP TechStore{% endblock %}

{% block content %}
<!-- ============================================================ -->
<!-- FORMULARIO DE REGISTRO (RF02)                                -->
<!-- ============================================================ -->

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <h1 class="mb-1 text-center">Crear Cuenta</h1>
        <p class="text-muted text-center mb-4">Complete el formulario para registrarse en el sistema.</p>

        <div class="card">
            <div class="card-body p-4">

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold small text-uppercase text-muted">Nombre Completo</label>
                        <input type="text" name="nombre" id="nombre" class="form-control"
                               placeholder="Su nombre" required autofocus>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-uppercase text-muted">Correo Electronico</label>
                        <input type="email" name="email" id="email" class="form-control"
                               placeholder="tu@email.com" required>
                    </div>

                    <!-- Contrasena -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small text-uppercase text-muted">Contrasena</label>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="Minimo 4 caracteres" required minlength="4">
                    </div>

                    <!-- Confirmar contrasena -->
                    <div class="mb-3">
                        <label for="password_confirm" class="form-label fw-semibold small text-uppercase text-muted">Confirmar Contrasena</label>
                        <input type="password" name="password_confirm" id="password_confirm" class="form-control"
                               placeholder="Repita su contrasena" required minlength="4">
                    </div>

                    <!-- Boton -->
                    <button type="submit" class="btn btn-success w-100 mt-2">
                        Crear Cuenta
                    </button>
                </form>

            </div>
        </div>

        <!-- Enlace a login -->
        <p class="text-center mt-3 small">
            Ya tiene cuenta?
            <a href="{{ url_for('auth.login') }}">Inicie sesion aqui</a>
        </p>

    </div>
</div>

{% endblock %}
