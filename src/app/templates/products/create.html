{% extends "base.html" %}
{% block title %}Nuevo Producto — ERP TechStore{% endblock %}

{% block content %}
<!-- ============================================================ -->
<!-- FORMULARIO: CREAR PRODUCTO (RF05)                            -->
<!-- ============================================================ -->

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="page-head">
            <span class="page-head-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M19 8v6"></path>
                    <path d="M22 11h-6"></path>
                </svg>
            </span>
            <div>
                <h1 class="mb-0">Nuevo Producto</h1>
                <p class="text-muted small mb-0">Registre un producto en el inventario del sistema.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-4">

                <form method="POST" action="{{ url_for('products.crear') }}" enctype="multipart/form-data">
                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold small text-uppercase text-muted">Nombre del Producto *</label>
                        <input type="text" name="nombre" id="nombre" class="form-control"
                               placeholder="Ej: Laptop Pro 15&quot;" required autofocus>
                    </div>

                    <!-- Descripcion -->
                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-semibold small text-uppercase text-muted">Descripcion</label>
                        <textarea name="descripcion" id="descripcion" class="form-control" rows="3"
                                  placeholder="Descripcion detallada del producto..."></textarea>
                    </div>

                    <!-- Precio y Stock (misma fila) -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label fw-semibold small text-uppercase text-muted">Precio ($) *</label>
                            <input type="number" name="precio" id="precio" class="form-control"
                                   placeholder="0.00" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stock" class="form-label fw-semibold small text-uppercase text-muted">Stock Inicial *</label>
                            <input type="number" name="stock" id="stock" class="form-control"
                                   placeholder="0" min="0" required>
                        </div>
                    </div>

                    <!-- Categoria -->
                    <div class="mb-3">
                        <label for="categoria" class="form-label fw-semibold small text-uppercase text-muted">Categoria</label>
                        <input type="text" name="categoria" id="categoria" class="form-control"
                               placeholder="Ej: Computadoras, Perifericos, Monitores...">
                    </div>

                    <!-- Imagen -->
                    <div class="mb-3">
                        <label for="imagen" class="form-label fw-semibold small text-uppercase text-muted">Imagen del Producto</label>
                        <input type="file" name="imagen" id="imagen" class="form-control"
                               accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
                        <div class="form-text">PNG, JPG, WEBP, GIF o SVG. Tamano maximo 5 MB. Opcional.</div>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-success">
                            Guardar Producto
                        </button>
                        <a href="{{ url_for('products.listar') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
