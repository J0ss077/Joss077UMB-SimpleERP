{% extends "base.html" %}
{% block title %}Iniciar Sesion — ERP TechStore{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<!-- ============================================================ -->
<!-- FORMULARIO DE LOGIN (RF01)                                   -->
<!-- ============================================================ -->

<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <h1 class="mb-1 text-center">Iniciar Sesion</h1>
        <p class="text-muted text-center mb-4">Ingrese sus credenciales para acceder al sistema.</p>

        <div class="card">
            <div class="card-body p-4">

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-uppercase text-muted">Correo Electronico</label>
                        <input type="email" name="email" id="email" class="form-control"
                               placeholder="tu@email.com" required autofocus>
                    </div>

                    <!-- Contrasena -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small text-uppercase text-muted">Contrasena</label>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="········" required>
                    </div>

                    <!-- Boton -->
                    <button type="submit" class="btn btn-primary w-100 mt-2">
                        Iniciar Sesion
                    </button>
                </form>

            </div>
        </div>

        <!-- Enlace a registro -->
        <p class="text-center mt-3 small">
            No tiene cuenta?
            <a href="{{ url_for('auth.register') }}">Registrese aqui</a>
        </p>

    </div>
</div>

{% endblock %}
